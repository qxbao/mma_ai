[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mma_ai"
version = "0.1.0"
description = "Hệ thống mô phỏng và điều khiển cử động cơ bắp MMA AI"
requires-python = ">=3.11,<3.13"
# Quyết định phụ thuộc (bỏ MyoSuite, ghim gymnasium 1.4): specs/002-elbow-muscle-env/research.md (Q1)
dependencies = [
    "mujoco==3.15.0",
    "myo-sim==0.2.3",
    "gymnasium>=1.4,<1.5",
    "jsonschema",
    "numpy",
    "pyyaml",
]

[project.optional-dependencies]
rl = [
    "torch",
    "tensorboard",
]
dev = [
    "pytest",
    "jsonschema",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mma_ai"]
artifacts = [
    "src/mma_ai/visualization/*.yaml",
    "src/mma_ai/environment/*.yaml",
    "src/mma_ai/learning/*.yaml",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src/mma_ai",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "display: cho phép sử dụng biến môi trường DISPLAY và WAYLAND_DISPLAY",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_decorators = false
warn_return_any = true
warn_unused_configs = false

[[tool.mypy.overrides]]
module = [
    "conftest",
    "tests.*",
    "tests.unit.*",
]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "pytest.*",
    "mujoco.*",
    "myo_sim.*",
    "gymnasium.*",
    "yaml.*",
    "torch.*",
    "jsonschema.*",
    "tensorboard.*",
    "packaging.*",
]
ignore_missing_imports = true
